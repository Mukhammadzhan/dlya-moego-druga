name: Unpack website music

on:
  push:
    branches: [main]
    paths:
      - 'Для_моего_друга_для_GitHub.zip'
      - '.github/workflows/unpack-music.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract the uploaded music and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          unzip -p 'Для_моего_друга_для_GitHub.zip' 'dont-worry-be-happy.mp3' > dont-worry-be-happy.mp3
          echo '6dfa880a6fced875aa436608e17821aeb7d1a0509c07f10d5312f4794075b16c  dont-worry-be-happy.mp3' | sha256sum -c -
          test -s index.html
      - name: Commit extracted MP3 to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dont-worry-be-happy.mp3
          if ! git diff --cached --quiet; then
            git commit -m "Add background music supplied for friend website"
            git push origin main
          fi
